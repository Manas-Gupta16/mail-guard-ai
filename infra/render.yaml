# Render Blueprint Specification for Mail Guard AI Cloud Deployment
services:
  # 1. Python FastAPI ML Microservice (DistilBERT ONNX + Kernel SHAP)
  - type: web
    name: mail-guard-ml-service
    env: python
    region: oregon
    plan: standard
    dockerfilePath: packages/ml-service/Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: MODEL_NAME
        value: DistilBERT-Spam-Detector
      - key: MODEL_VERSION
        value: 2.0.0
      - key: GEMINI_API_KEY
        sync: false

  # 2. Node.js Express API Gateway
  - type: web
    name: mail-guard-api-gateway
    env: node
    region: oregon
    plan: starter
    dockerfilePath: packages/api-server/Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: mail-guard-ml-service
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: mail-guard-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mail-guard-redis
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

  # 3. Static Web Client Frontend
  - type: web
    name: mail-guard-web-client
    env: static
    region: oregon
    buildCommand: cd packages/web-client && npm install && npm run build
    staticPublishPath: packages/web-client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Managed Databases
databases:
  - name: mail-guard-postgres
    plan: starter
    databaseName: mailguard
    user: mailguard_admin

  - name: mail-guard-redis
    plan: starter
