name: Mail Guard AI — Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ml-service-tests:
    name: ML Service (Pytest & ONNX DistilBERT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/ml-service/requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest test suite
        run: |
          pytest packages/ml-service/tests -v

  api-server-tests:
    name: API Gateway (Node.js 20 & Jest Integration Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/api-server/package.json

      - name: Install API Server dependencies
        working-directory: packages/api-server
        run: npm ci || npm install

      - name: Generate Prisma client
        working-directory: packages/api-server
        run: npx prisma generate

      - name: Run Jest test suite
        working-directory: packages/api-server
        run: npm test

  web-client-build:
    name: Web Client (TypeScript & Vite Production Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/web-client/package.json

      - name: Install Web Client dependencies
        working-directory: packages/web-client
        run: npm ci || npm install

      - name: Build production bundle
        working-directory: packages/web-client
        run: npm run build

  docker-build-verification:
    name: Docker Multi-Container Compose Build
    runs-on: ubuntu-latest
    needs: [ml-service-tests, api-server-tests, web-client-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build all container images
        run: docker compose build
