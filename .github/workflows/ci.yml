# ============================================
# Mail Guard AI — CI Pipeline
# Runs on every PR and push to main: lint, test, docker build
# ============================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─── Python ML Service ─────────────────────────────────────────────
  ml-service:
    name: ML Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ml-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Run Pytest suite
        run: PYTHONPATH=. pytest

  # ─── Node.js API Server ────────────────────────────────────────────
  api-server:
    name: API Server (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/api-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Jest test suite
        env:
          NODE_ENV: test
        run: npm test

  # ─── Docker Build Test ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ml-service, api-server]

    steps:
      - uses: actions/checkout@v4

      - name: Build ML Service Container
        run: docker build -t mail-guard-ml:test packages/ml-service

      - name: Build API Server Container
        run: docker build -t mail-guard-api:test packages/api-server
